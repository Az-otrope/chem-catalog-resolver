[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-catalog-resolver"
version = "0.1.0"
description = "Reconciling chemical product data across supplier catalogues"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.6",
    "pypdf>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chemspec = "chemspec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
