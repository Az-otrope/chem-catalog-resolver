# Seed substances: inorganic salts and their hydrates.
#
# The family is chosen, not sampled. Hydrates are the case where naive name
# matching fails hardest and most quietly: the anhydrous salt and its hydrate
# share a name to within one token, but they are different substances with
# different registry numbers, different molar masses and different assays.
#
# Every `pairs` entry below is a deliberate trap for the matcher — two CAS
# numbers whose names differ only by a hydration word. If the matcher gets
# these right it is doing something real; if it gets them wrong it is doing
# string similarity and calling it entity resolution.

search_terms:
  - copper sulfate
  - copper sulfate pentahydrate
  - sodium carbonate
  - sodium carbonate decahydrate
  - magnesium sulfate
  - magnesium sulfate heptahydrate
  - calcium chloride
  - calcium chloride dihydrate
  - sodium acetate
  - sodium acetate trihydrate
  - iron(II) sulfate heptahydrate
  - zinc sulfate heptahydrate
  - nickel(II) chloride hexahydrate
  - cobalt(II) chloride hexahydrate
  - manganese(II) sulfate monohydrate
  - sodium citrate dihydrate
  - sodium thiosulfate pentahydrate
  - barium hydroxide octahydrate
  - aluminium potassium sulfate dodecahydrate
  - sodium phosphate dibasic dodecahydrate
  - potassium sodium tartrate tetrahydrate
  - sodium tetraborate decahydrate
  - citric acid monohydrate
  - oxalic acid dihydrate
  - lithium hydroxide monohydrate

# Anhydrous / hydrate pairs with known-distinct registry numbers.
# Used by tests and by the evaluation as the hard cases.
pairs:
  - name: copper(II) sulfate
    anhydrous: 7758-98-7
    hydrate: 7758-99-8
    waters: 5

  - name: sodium carbonate
